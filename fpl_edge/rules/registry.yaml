# FPL rule registry for season 2026/27.
#
# EVERY rule the engine relies on MUST appear here with a source and fetched_at.
# `verified: true` means a human-readable authoritative source was read and the
# value transcribed from it. `verified: false` means the value is a guess or an
# inference -- code that reads an unverified rule raises UnverifiedRuleError.
#
# Sources:
#   API   = https://fantasy.premierleague.com/api/bootstrap-static/
#   RULES = https://fantasy.premierleague.com/help/rules
season: "2026/27"

sources:
  API:
    url: "https://fantasy.premierleague.com/api/bootstrap-static/"
    fetched_at: "2026-08-18T22:42:47Z"
    note: "Machine-readable game_config.scoring / game_config.rules / chips / element_types."
  RULES:
    url: "https://fantasy.premierleague.com/help/rules"
    fetched_at: "2026-08-18T22:43:00Z"
    note: >
      Rendered via headless browser; the page is a JS SPA and returns an empty
      shell to plain HTTP fetches. IMPORTANT: the deadline table on this page is
      rendered in BROWSER-LOCAL time, not UK time. Observed "GW1 Fri 21 Aug 10:30"
      against the API's 2026-08-21T17:30:00Z (US/Pacific offset). Never parse
      deadlines from this page -- use the API's UTC values.

