<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>i-test</title>
<link rel="stylesheet" href="/app.css">
<!-- Per-view stylesheets. Zero-build, so an extra <link> costs nothing and
     keeps a big view's CSS out of app.css, which every view shares. -->
<link rel="stylesheet" href="/template.css">
<link rel="stylesheet" href="/creators.css">
<link rel="stylesheet" href="/template-tools.css">
<!-- shared component, mounted from several views, so it links once here -->
<link rel="stylesheet" href="/chatter.css">
</head>
<body>
<div class="frame">
  <nav class="rail">
    <div class="brand">i<b>-test</b></div>
    <a href="#home">Dashboard</a>
    <a href="#planner">Planner</a>
    <a href="#xpoints">xPoints</a>
    <a href="#template">Template &amp; EO</a>
    <a href="#creators">Creators</a>
    <a href="#fixtures">Fixtures</a>
    <a href="#solver">Solver</a>
    <a href="#chat">Chat</a>
    <div class="foot">panels are the only data path</div>
  </nav>
  <main class="content">
    <div class="topbar">
      <h1 id="view-title">Dashboard</h1>
      <span class="deadline" id="deadline">…</span>
      <span class="spacer"></span>
      <button id="theme-btn" title="Toggle theme">Theme</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<script type="module">
import { register, start } from "/js/app.js";
import home from "/js/views/home.js";
import planner from "/js/views/planner.js";
import xpoints from "/js/views/xpoints.js";
import template from "/js/views/template.js";
import fixtures from "/js/views/fixtures.js";
import solver from "/js/views/solver.js";
import chat from "/js/views/chat.js";
import creators from "/js/views/creators.js";

register("home", "Dashboard", home);
register("planner", "Transfer planner", planner);
register("xpoints", "Projections", xpoints);
register("template", "Template & effective ownership", template);
register("fixtures", "Fixtures", fixtures);
register("solver", "Solver", solver);
register("creators", "Content creators", creators);
register("chat", "Chat", chat);
start();
</script>
</body>
</html>
