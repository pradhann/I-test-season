[project]
name = "fpl-edge"
version = "0.1.0"
description = "Rank-utility optimizing FPL decision engine"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "numpy>=1.26",
  "scipy>=1.13",
  "httpx>=0.27",
  "tenacity>=8.3",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "pulp>=2.9",
  "highspy>=1.7",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "python-dateutil>=2.9",
  "typer>=0.12",
  "rich>=13.7",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "matplotlib>=3.9",
  "youtube-transcript-api>=0.6",
  "anthropic>=0.40",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sse-starlette>=2.1",
  "jsonschema>=4.23",
  "mcp[cli]>=1.2,<2",
  # Local speech-to-text for the creator corpus. mlx-whisper runs on the Metal
  # GPU; `av` decodes podcast audio in-process so no system ffmpeg is needed.
  # Both were installed by hand during the build and would be removed by the
  # next `uv sync` if they were not declared here.
  "mlx-whisper>=0.4; sys_platform == 'darwin'",
  "av>=12",  # v2 renamed FastMCP->MCPServer; migration is its own change
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "hypothesis>=6.108", "ruff>=0.6", "mypy>=1.11", "freezegun>=1.5"]

[project.scripts]
fpl = "fpl_edge.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires live network (deselected by default)"]
addopts = "-m 'not network' -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fpl_edge"]
