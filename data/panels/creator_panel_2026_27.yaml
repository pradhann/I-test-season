# ===========================================================================
# 2026-09-07 -- hosts of the ~20 corpus shows whose people were not on the
# roster. Method: the leagues.classic[] graph again (walk from a known-good
# entry into invite-only creator leagues: FFScout Pro Pundits 1426424, FFScout
# Mods & Cons 8449, Planet #FPL Correspondents 122418, Hub Team 357994, Green
# Arrow Hosts 32932, Sky Sports News guests 5814, AC Community Team 1099942,
# livestream merchants fml fpl 1917942), then read every candidate back from
# /api/entry/{id}/ and look for admin_entry of a league named after their own
# channel. Full audit trail, including dead ends, in
# docs/platform/creator_identity_research.md (section dated 2026-09-07).
#
# TWO MORE SOURCES THAT RESOLVED TO STRANGERS, recorded so nobody re-walks them:
#   * The Premier League's own FPL Pod RSS published "Sam Bonfield ... Her team:
#     /entry/32044/" and "Julien Laurens ... /entry/2496505/". Today 32044 is
#     Tomas Naulickas (Lithuania) and 2496505 is Ebbe Gaerdelid (Sweden). The
#     Fantasy Football Scout feed's "Follow Gianni here: /entry/24862/" is now
#     George Mayhew. Old show-notes ids, even from the game operator, are not
#     evidence; only a live read-back is.
#   * League ids DO recycle across seasons (the FPL Pod's "Official FPL Podcast
#     (Guests)" 730132 is now a 4-man "League of Ordinary Gentlemen"; FML FPL's
#     146684 is now "Balon D Best 3"). Never cite a league id from an old page.
# ===========================================================================

