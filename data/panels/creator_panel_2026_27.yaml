# Creator panel -- person-level FPL entry identities, season 2026/27.
#
# ONE ROW PER PERSON, not per show. Podcast co-hosts each get their own row so a
# pick recorded off an episode ties to the team of the person who said it.
#
# ==========================================================================
# A WRONG ID DOES NOT 404 -- IT RESOLVES TO A DIFFERENT REAL PERSON.
# That is the whole hazard, and this repo has already shipped it: twenty
# unverified ids served a stranger's rank history under a creator's name.
#
# Note what the hazard is NOT. Entry ids are STABLE across seasons, not
# reassigned each August: entry 53517 carries 19 seasons of history under one
# id (2007/08 -> 2025/26), checked against /api/entry/53517/history/ on
# 2026-08-27. So these rows do not rot on a timer, and nobody needs to
# re-verify them every August as a matter of routine.
#
# The twenty that went bad were wrong WHEN WRITTEN -- copied from a source
# nobody checked. Which is exactly the failure this file's audit trail exists
# to prevent, and exactly what happened again during this research when a
# plausible-looking "creator league table" page yielded twenty fabricated ids
# (see docs/platform/creator_identity_research.md). Verify on entry, not on a
# schedule. See fpl_edge/ingest/rivals/elite.py verify() for the helper.
# ==========================================================================
#
# How these ids were established (full audit trail:
# docs/platform/creator_identity_research.md):
#
#   Every id below was read back from https://fantasy.premierleague.com/api/entry/{id}/
#   on 2026-08-27, and `entry_api_name` is the account holder's real
#   player_first_name + player_last_name as the API returned it.
#
#   Name matching alone was NOT treated as sufficient -- a creator's account is
#   under their legal name, and common names collide. The corroborating evidence
#   is that the *public* entry endpoint also returns `leagues.classic[]`,
#   including each invitational league's `id`, `name` and `admin_entry`. An
#   account that ADMINISTERS a league named after the creator's own channel
#   (e.g. entry 3054 admins league 7735 "www.youtube.com/@FPLHarry") is
#   self-identifying: only the account holder can create and admin that league.
#   That is the "conclusive" bar used below. Membership of an invite-only
#   creator league (FPL BlackBox Contributors, The FPL Wire Discord, Hub
#   Contributors) plus an independent record match is the "high" bar.
#
#   Caveat carried honestly: league names are user-set free text, so the league
#   evidence is strong but not cryptographic. Where a row rests on weaker
#   evidence, `entry_confidence` says so.
#
# entry_confidence: conclusive | high | medium | low
#   Rows may only be rendered in the UI at `conclusive` or `high`.
#
# top10k_finishes is COUNTED from /api/entry/{id}/history/ `past[]`
# (rank <= 10000), not copied from marketing copy. `best_ever_rank` likewise.
#
# A REJECTED SOURCE, recorded so nobody re-walks it:
#   fantasyfootballpundit.com/fpl-content-creators-league-table/ appears to be
#   exactly the page this file needs. Its table is JS-loaded; the raw HTML
#   contains none of the numbers, and a fetch-and-summarise of it returned a
#   clean-looking table of 20 creator "team IDs" that was entirely fabricated.
#   All ten sampled ids resolved to unrelated strangers (e.g. it gave FPL Harry
#   3544 = "Niklavs Grava"; FPL Salah 156 = "Mohammed Naif"). Do not use it.

